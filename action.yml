name: Install Fortify
description: Install a verified Fortify CLI release and add it to PATH.
inputs:
  version:
    description: Release version without the leading v. Defaults to the latest release.
    required: false
    default: latest
runs:
  using: composite
  steps:
    - name: Install Fortify
      shell: bash
      env:
        FORTIFY_VERSION_INPUT: ${{ inputs.version }}
        FORTIFY_INSTALL_DIR: ${{ runner.temp }}/fortify/bin
      run: |
        if [[ "${FORTIFY_VERSION_INPUT}" != "latest" ]]; then
          export FORTIFY_VERSION="${FORTIFY_VERSION_INPUT}"
        fi
        "${GITHUB_ACTION_PATH}/install.sh"
        echo "${FORTIFY_INSTALL_DIR}" >> "${GITHUB_PATH}"
